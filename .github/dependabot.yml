# Dependabot opens pull requests that bump outdated dependencies.
# Each run tests them through the pull_request trigger in workflows/pages.yml.
version: 2

updates:
  # ---------------------------------------------------------------
  # npm packages from package.json / package-lock.json
  # ---------------------------------------------------------------
  - package-ecosystem: npm
    # Folder that holds package.json. Change only if the app moves
    # into a subfolder.
    directory: /
    schedule:
      # How often Dependabot looks for updates. "monthly" keeps the
      # pull request count low; "weekly" catches updates sooner at the
      # cost of more pull requests to review.
      interval: monthly
    groups:
      # Puts every npm bump into one pull request instead of one per
      # package. Remove the group if a single bump keeps breaking the
      # build and you want to merge the others without it.
      npm:
        patterns: ["*"]
    ignore:
      # opentype.js 2.0 throws "lookupType: 6 - substFormat: 2 is not yet
      # supported" on the bundled fonts' ccmp feature, breaking text and
      # umlauts. Remove once a 2.x release supports it and tests pass.
      - dependency-name: opentype.js
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------
  # GitHub Actions used in .github/workflows
  # ---------------------------------------------------------------
  - package-ecosystem: github-actions
    # For this ecosystem "/" means the .github/workflows folder.
    directory: /
    schedule:
      # Actions change rarely; monthly is plenty. Old majors get
      # retired by GitHub, which is what these bumps protect against.
      interval: monthly
    groups:
      # One pull request for all action bumps.
      actions:
        patterns: ["*"]
