<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Design your own lithophane light box in the browser and download it as STL or 3MF." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='5' y='5' width='22' height='22' rx='3' fill='%23e9a23b'/><rect x='9' y='9' width='14' height='14' fill='%23fff3d6'/></svg>" />
    <title>Lithobox Creator</title>
    <!-- Anonymous usage counts (self-hosted Umami, no cookies). The hash holds the design, so it is left out. -->
    <script defer src="https://api.lithobox.app/lb.js" data-website-id="5b6ba8ba-2400-4ce2-933d-cbf4b38eb0ec" data-domains="lithobox.app" data-exclude-hash="true"></script>
  </head>
  <body>
    <header class="top">
      <div class="brand"><span class="logo"></span><span data-i18n="app.title"></span><button type="button" id="version" class="version"></button></div>
      <div class="top-actions">
        <button type="button" id="saveProject" class="btn small"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14" /></svg><span class="btn-text" data-i18n="project.save"></span></button>
        <label class="btn small" id="projectOpen"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg><span class="btn-text" data-i18n="project.open"></span><input type="file" id="projectFile" accept=".lithobox" hidden /></label>
        <a class="btn small" href="https://github.com/Joly0/lithobox-creator" target="_blank" rel="noopener" aria-label="GitHub"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 6-6 6 6 6m8-12 6 6-6 6" /></svg><span class="btn-text">GitHub</span></a>
        <select id="lang" aria-label="Language"></select>
      </div>
    </header>
    <dialog id="changes" class="changes" aria-labelledby="changesTitle">
      <div class="changes-head"><h2 id="changesTitle" data-i18n="changes.title"></h2><button type="button" id="changesClose" class="link" data-i18n="changes.close"></button></div>
      <div id="changesList"></div>
      <p id="changesVersion" class="hint"></p>
    </dialog>
    <main class="layout">
      <aside class="side">
        <nav class="steps" role="tablist">
          <button type="button" class="step" id="tab-design" role="tab" data-step="design"><span class="num">1</span><span data-i18n="step.design"></span></button>
          <button type="button" class="step" id="tab-pictures" role="tab" data-step="pictures"><span class="num">2</span><span data-i18n="step.pictures"></span></button>
        </nav>
        <div class="side-head">
          <label class="switch"><input type="checkbox" id="advanced" /> <span data-i18n="ui.advanced"></span></label>
          <button id="reset" class="link" data-i18n="ui.reset"></button>
        </div>
        <section id="step-design" class="step-body">
          <label class="preset" id="shapeRow"><span data-i18n="ui.shape"></span> <select id="shape"></select></label>
          <label class="preset" id="presetRow"><span data-i18n="ui.preset"></span> <select id="preset"></select></label>
          <div id="params"></div>
          <details class="group profile" id="profileBox">
            <summary data-i18n="profile.title"></summary>
            <p class="hint" data-i18n="profile.hint"></p>
            <p id="profileInfo" class="hint"></p>
            <div class="profile-actions">
              <label class="btn small"><span data-i18n="profile.load"></span><input type="file" id="profileFile" accept=".3mf" hidden /></label>
              <button id="profileClear" class="link" data-i18n="profile.clear"></button>
            </div>
          </details>
          <button type="button" class="btn primary step-next" data-goto="pictures" data-i18n="step.next"></button>
        </section>
        <section id="step-pictures" class="step-body">
          <div id="pictures"></div>
          <div id="lithoParams"></div>
          <button type="button" class="btn step-next" data-goto="design" data-i18n="step.back"></button>
        </section>
      </aside>
      <section class="stage">
        <div id="viewport"></div>
        <!-- phone only: folds the preview to a thin strip -->
        <button type="button" id="foldPreview" class="fold" aria-expanded="true"><span class="fold-label" data-i18n="ui.preview"></span><span class="chev" aria-hidden="true"></span></button>
        <div class="viewbar">
          <label><span data-i18n="ui.explode"></span> <input type="range" id="explode" min="0" max="1" step="0.01" value="0" /></label>
          <label><input type="checkbox" id="section" /> <span data-i18n="ui.section"></span></label>
          <label><input type="checkbox" id="ghosts" checked /> <span data-i18n="ui.ghosts"></span></label>
          <label><input type="checkbox" id="edges" checked /> <span data-i18n="ui.edges"></span></label>
          <label><input type="checkbox" id="lamp" /> <span data-i18n="ui.lamp"></span></label>
  <label><input type="checkbox" id="printView" /> <span data-i18n="ui.printView"></span></label>
          <button id="frame" class="link" data-i18n="ui.frame"></button>
          <span id="status" class="status"></span>
        </div>
      </section>
      <!-- phone only: drag to share the screen between the preview and the settings -->
      <div id="splitter" class="splitter" role="separator" aria-orientation="horizontal" tabindex="0"></div>
      <!-- below the preview on the desktop, the last row of the column on a phone -->
      <div class="outbar">
        <ul id="info" class="info"></ul>
        <div class="exports">
          <div id="parts" class="parts"></div>
          <button id="exportPlain" class="btn" data-i18n="export.plain3mf"></button>
          <button id="exportStl" class="btn" data-i18n="export.stlZip"></button>
          <button id="export3mf" class="btn primary"><span class="long" data-i18n="export.threemf"></span><span class="short" data-i18n="export.threemfShort"></span></button>
          <!-- phone only: opens the other downloads, the info and the parts -->
          <button type="button" id="moreExports" class="btn more" aria-expanded="false"><span data-i18n="export.more"></span><span id="moreBadge" class="badge" hidden></span></button>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
